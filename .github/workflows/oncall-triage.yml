name: Oncall Issue Triage
# DISABLED: Requires ANTHROPIC_API_KEY secret which is not configured in this repository.
# To re-enable: add ANTHROPIC_API_KEY to repository secrets and restore the original triggers.
on:
  workflow_dispatch: # Manual trigger only - requires ANTHROPIC_API_KEY secret to be set

jobs:
  oncall-triage:
    runs-on: ubuntu-latest
    if: false # Disabled - ANTHROPIC_API_KEY secret not configured
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write

    steps:
      - name: Disabled
        run: echo "This workflow is disabled. Set ANTHROPIC_API_KEY secret to enable."